apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: ai-bos
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-bos
      component: backend
  template:
    metadata:
      labels:
        app: ai-bos
        component: backend
    spec:
      containers:
      - name: backend
        image: ai-bos/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ai-bos-secrets
              key: database_url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: ai-bos-secrets
              key: redis_url
        - name: AI_MODE
          value: "HYBRID"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
